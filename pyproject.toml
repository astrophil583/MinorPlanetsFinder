[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minorplanetsfinder"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "astropy>=6.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "requests>=2.31",
    "rich>=13.0",
]

[project.scripts]
minorplanetsfinder = "minorplanetsfinder:main"

[tool.setuptools]
py-modules = ["minorplanetsfinder"]
